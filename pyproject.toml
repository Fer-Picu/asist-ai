[project]
name = "asit-ia"
version = "0.1.0"
description = "Asist AI: local Linux dictation with whisper.cpp and clipboard output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "setuptools>=65,<81",
  "webrtcvad>=2.0.10",
]

[project.scripts]
asit-ia = "asit_ia.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asit_ia"]
