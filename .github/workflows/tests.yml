name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.11'
      - name: Install native libraries for legacy X11 unit tests
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxtst6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Check installed CLI from wheel
        run: uv run --isolated --no-project --with dist/asit_ia-0.1.0-py3-none-any.whl asit-ia --help
